{% extends "base.html" %}

{% block title %}心理对话历史 - 愈见花园{% endblock %}

{% block content %}
<div class="chat-history-container">
    <div class="sessions-sidebar">
        <div class="sidebar-header">
            <h3>历史对话</h3>
            <button id="new-chat-btn" class="new-chat-btn">+ 新对话</button>
        </div>
        <div id="sessions-list" class="sessions-list">
            <!-- Sessions will be loaded dynamically -->
        </div>
    </div>
    
    <div class="chat-main">
        <div class="chat-header">
            <h2 id="current-session-title">新对话</h2>
            <p id="session-info">随时分享你的想法和感受，我会认真倾听</p>
        </div>
        
        <div id="chat-history" class="chat-history">
            <!-- Messages will be loaded dynamically -->
        </div>
        
        <div class="chat-input">
            <textarea id="message-input" placeholder="请告诉我你的感受..."></textarea>
            <button id="voice-btn" class="voice-btn">🎤</button>
            <button id="send-btn">发送</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const sessionsList = document.getElementById('sessions-list');
    const chatHistory = document.getElementById('chat-history');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const voiceBtn = document.getElementById('voice-btn');
    const newChatBtn = document.getElementById('new-chat-btn');
    const currentSessionTitle = document.getElementById('current-session-title');
    const sessionInfo = document.getElementById('session-info');
    
    let currentSessionId = null;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // Load user sessions
    loadSessions();

    // Create new chat session
    newChatBtn.addEventListener('click', function() {
        fetch('/chat/new-session', {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            if (data.session_id) {
                currentSessionId = data.session_id;
                currentSessionTitle.textContent = '新对话';
                sessionInfo.textContent = '开始新的对话';
                chatHistory.innerHTML = '';
                loadSessions();
            }
        });
    });

    // Send message
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function loadSessions() {
        fetch('/chat/sessions')
            .then(response => response.json())
            .then(sessions => {
                sessionsList.innerHTML = '';
                sessions.forEach(session => {
                    const sessionElement = document.createElement('div');
                    sessionElement.className = 'session-item';
                    sessionElement.dataset.sessionId = session.session_id;
                    
                    sessionElement.innerHTML = `
                        <div class="session-preview">
                            <strong>${session.last_message}</strong>
                            <span class="session-time">${session.last_timestamp}</span>
                        </div>
                        <div class="session-meta">
                            ${session.message_count} 条消息
                        </div>
                    `;
                    
                    sessionElement.addEventListener('click', () => {
                        loadSession(session.session_id, session.last_message);
                    });
                    
                    sessionsList.appendChild(sessionElement);
                });
            });
    }

    function loadSession(sessionId, sessionTitle) {
        currentSessionId = sessionId;
        currentSessionTitle.textContent = sessionTitle || '对话详情';
        sessionInfo.textContent = '查看历史对话';
        
        fetch(`/chat/session/${sessionId}`)
            .then(response => response.json())
            .then(messages => {
                chatHistory.innerHTML = '';
                messages.forEach(msg => {
                    addMessageToUI(msg.role, msg.content, msg.timestamp);
                });
            });
    }

    function sendMessage() {
        if (!currentSessionId) {
            alert('请先选择一个对话或创建新对话');
            return;
        }

        const message = messageInput.value.trim();
        if (!message) return;
        
        addMessageToUI('user', message, new Date().toLocaleString());
        messageInput.value = '';
        
        fetch('/chat/send', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
                message: message,
                session_id: currentSessionId 
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.reply) {
                addMessageToUI('assistant', data.reply, new Date().toLocaleString());
                loadSessions(); // Refresh sessions list
            }
        });
    }

    function addMessageToUI(role, content, timestamp) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        
        const roleLabel = role === 'user' ? '你' : '心理助手';
        messageDiv.innerHTML = `
            <div class="message-header">
                <span class="role">${roleLabel}</span>
                <span class="time">${timestamp}</span>
            </div>
            <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
        `;
        
        if (role === 'assistant') {
            const voiceBtn = document.createElement('button');
            voiceBtn.className = 'voice-play-btn';
            voiceBtn.innerHTML = '🔊';
            voiceBtn.onclick = () => playVoice(content);
            messageDiv.querySelector('.message-content').appendChild(voiceBtn);
        }
        
        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // Voice recording and playback functions (same as before)
    voiceBtn.addEventListener('click', toggleRecording);
    
    async function toggleRecording() {
        if (isRecording) {
            stopRecording();
        } else {
            await startRecording();
        }
    }

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    sampleRate: 16000,
                    channelCount: 1,
                    echoCancellation: false,
                    noiseSuppression: false
                }
            });

            const options = { 
                mimeType: 'audio/webm;codecs=opus',
                audioBitsPerSecond: 16000
            };
            
            mediaRecorder = new MediaRecorder(stream, options);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                
                try {
                    const response = await fetch('/chat/voice-input', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    if (result.text) {
                        messageInput.value = result.text;
                    }
                } catch (error) {
                    console.error('发送语音失败:', error);
                }
            };
            
            mediaRecorder.start();
            isRecording = true;
            voiceBtn.classList.add('recording');
            voiceBtn.textContent = '⏹️';
        } catch (error) {
            console.error('录音失败:', error);
        }
    }
    
    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            voiceBtn.classList.remove('recording');
            voiceBtn.textContent = '🎤';
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        }
    }

    function playVoice(text) {
        fetch('/chat/voice-output', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ text })
        })
        .then(response => response.blob())
        .then(blob => {
            const audio = new Audio(URL.createObjectURL(blob));
            audio.play();
        });
    }
});
</script>

<style>
.chat-history-container {
    display: flex;
    height: calc(100vh - 120px);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    border: 1px solid #EDE9E2;
    background: #fff;
}

.sessions-sidebar {
    width: 280px;
    min-width: 240px;
    border-right: 1px solid #EDE9E2;
    background: #FAFAF8;
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    padding: 18px 16px;
    border-bottom: 1px solid #EDE9E2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
}

.sidebar-header h3 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #3D3D3D;
}

.new-chat-btn {
    padding: 7px 16px;
    background: #5A9E96;
    color: #fff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
}

.new-chat-btn:hover {
    background: #4A8A82;
    box-shadow: 0 2px 8px rgba(90,158,150,0.3);
}

.sessions-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
}

.session-item {
    padding: 13px 14px;
    margin-bottom: 6px;
    background: #fff;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid #EDE9E2;
    transition: all 0.2s;
}

.session-item:hover {
    background: #E8F4F2;
    border-color: #5A9E96;
}

.session-preview {
    margin-bottom: 6px;
}

.session-time {
    font-size: 12px;
    color: #999;
    display: block;
    margin-top: 4px;
}

.session-meta {
    font-size: 12px;
    color: #999;
}

.chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid #EDE9E2;
    background: #fff;
}

.chat-header h2 {
    margin: 0 0 2px;
    font-size: 18px;
    font-weight: 700;
    color: #3D3D3D;
}

.chat-header p {
    margin: 0;
    font-size: 13px;
    color: #999;
}

.chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #FBF9F6;
}

.message {
    margin-bottom: 16px;
    padding: 14px 18px;
    border-radius: 14px;
    position: relative;
    max-width: 75%;
    line-height: 1.65;
}

.message.user {
    background: #E8F4F2;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.message.assistant {
    background: #fff;
    border: 1px solid #EDE9E2;
    margin-right: auto;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

.message-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
    gap: 12px;
}

.message-header .role {
    font-weight: 700;
    color: #5A9E96;
}

.message.user .message-header .role {
    color: #3D7A73;
}

.message-content {
    font-size: 15px;
    color: #3D3D3D;
    word-break: break-word;
}

.voice-play-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 8px;
    background: #F2F9F8;
    border: 1px solid #D4E8E5;
    border-radius: 20px;
    width: 32px;
    height: 32px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}

.voice-play-btn:hover {
    background: #E8F4F2;
    border-color: #5A9E96;
}

.chat-input {
    display: flex;
    align-items: flex-end;
    padding: 14px 20px;
    border-top: 1px solid #EDE9E2;
    background: #fff;
    gap: 10px;
}

.chat-input textarea {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid #EDE9E2;
    border-radius: 12px;
    resize: none;
    height: 80px;
    font-size: 15px;
    font-family: inherit;
    color: #3D3D3D;
    background: #FAFAF8;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.chat-input textarea:focus {
    outline: none;
    border-color: #5A9E96;
    box-shadow: 0 0 0 3px rgba(90,158,150,0.1);
    background: #fff;
}

.chat-input textarea::placeholder {
    color: #bbb;
}

.chat-input button {
    padding: 12px 22px;
    background: #5A9E96;
    color: #fff;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    white-space: nowrap;
}

.chat-input button:hover {
    background: #4A8A82;
    box-shadow: 0 2px 8px rgba(90,158,150,0.3);
}

.voice-btn {
    padding: 12px !important;
    width: 48px;
    height: 48px;
    font-size: 18px !important;
    border-radius: 50% !important;
}

.voice-btn.recording {
    background: #E05555 !important;
    animation: pulse-rec 1.5s infinite;
}

@keyframes pulse-rec {
    0%, 100% { box-shadow: 0 0 0 0 rgba(224,85,85,0.4); }
    50%      { box-shadow: 0 0 0 10px rgba(224,85,85,0); }
}
</style>
{% endblock %}
