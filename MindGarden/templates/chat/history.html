{% extends "base.html" %}

{% block title %}心理对话历史 - 愈见花园{% endblock %}

{% block content %}
<div class="chat-history-container">
    <div class="sessions-sidebar">
        <div class="sidebar-header">
            <h3>对话记录</h3>
            <button id="new-chat-btn" class="new-chat-btn">+ 新对话</button>
        </div>
        <div id="sessions-list" class="sessions-list">
            <!-- Sessions will be loaded dynamically -->
        </div>

        <!-- 添加分页控件 -->
        <div class="pagination-controls">
            <button id="prev-page-btn" class="page-btn" disabled>‹</button>
            <div id="page-numbers" class="page-numbers">
                <!-- 页码按钮将动态生成 -->
            </div>
            <button id="next-page-btn" class="page-btn">›</button>
        </div>
    </div>
    
    <div class="chat-main">
        <div class="chat-header">
            <h2 id="current-session-title">选择对话</h2>
            <p id="session-info">点击左侧的对话记录查看详情</p>
        </div>
        
        <div id="chat-history" class="chat-history">
            <div class="placeholder-message">
                <p>请从左侧选择一个对话记录查看详情</p>
            </div>
        </div>
        
        <div id="chat-input-container" class="chat-input" style="display: none;">
            <textarea id="message-input" placeholder="请告诉我你的感受..."></textarea>
            <button id="voice-btn" class="voice-btn">🎤</button>
            <button id="send-btn">发送</button>

            <!-- 语音识别进度条：识别要 10 秒左右，没有反馈用户会以为失败了 -->
            <div id="stt-progress" class="stt-progress" style="display:none;">
                <div class="stt-head">
                    <span class="stt-spinner"></span>
                    <span id="stt-label">正在识别语音…</span>
                    <span id="stt-percent" class="stt-percent">0%</span>
                </div>
                <div class="stt-track"><div id="stt-bar" class="stt-bar"></div></div>
                <div class="stt-hint">识别通常需要 5~15 秒，请稍候，不要重复点击</div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const sessionsList = document.getElementById('sessions-list');
    const chatHistory = document.getElementById('chat-history');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const voiceBtn = document.getElementById('voice-btn');
    const newChatBtn = document.getElementById('new-chat-btn');
    const currentSessionTitle = document.getElementById('current-session-title');
    const sessionInfo = document.getElementById('session-info');
    const chatInputContainer = document.getElementById('chat-input-container');
    
    let currentSessionId = null;
    let isCurrentSession = false;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // 分页相关变量
    let currentPage = 1;
    let totalPages = 1;
    let allSessions = [];
    const pageSize = 10; // 每页显示10条记录
    const maxPageButtons = 5; // 最多显示5个页码按钮

    // Load user sessions
    loadSessions();

    // 分页按钮事件监听
    document.getElementById('prev-page-btn').addEventListener('click', goToPrevPage);
    document.getElementById('next-page-btn').addEventListener('click', goToNextPage);

    // Create new chat session
    newChatBtn.addEventListener('click', function() {
        fetch('/chat/new-session', {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            if (data.session_id) {
                // 清除之前的历史对话状态
                const continueBtn = document.getElementById('continue-chat-btn');
                if (continueBtn) {
                    continueBtn.remove();
                }
                
                // 更新当前会话状态
                currentSessionId = data.session_id;
                isCurrentSession = true;
                currentSessionTitle.textContent = '新对话';
                sessionInfo.textContent = '开始新的对话';
                chatHistory.innerHTML = '';
                chatInputContainer.style.display = 'flex';
                
                // 保存到sessionStorage并刷新会话列表
                sessionStorage.setItem('current_session_id', data.session_id);
                loadSessions();
            }
        });
    });

    // Send message
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function formatBeijingTime(timestamp) {
        const date = new Date(timestamp);
        // 转换为北京时间 (UTC+8)
        const beijingOffset = 8 * 60; // 北京时区偏移量（分钟）
        const localOffset = date.getTimezoneOffset(); // 本地时区偏移量
        const beijingTime = new Date(date.getTime() + (beijingOffset + localOffset) * 60000);
        
        return beijingTime.toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        }).replace(/\//g, '-');
    }

    function loadSessions() {
        fetch('/chat/sessions')
            .then(response => response.json())
            .then(sessions => {
                allSessions = sessions;
                totalPages = Math.ceil(sessions.length / pageSize);
                
                //sessionsList.innerHTML = '';
                
                // 渲染当前页的会话
                renderCurrentPage();
                
                // 更新分页控件
                updatePaginationControls();

                // 获取当前会话ID
                const currentSessionFromStorage = sessionStorage.getItem('current_session_id');
                
                // 添加所有会话
                //sessions.forEach(session => {
                //    const isCurrent = session.session_id === currentSessionFromStorage;
                //    addSessionToUI(session, isCurrent);
                //});
                
                // 如果有当前会话且还没有加载过，自动加载它
                if (currentSessionFromStorage && !currentSessionId) {
                    const currentSession = sessions.find(s => s.session_id === currentSessionFromStorage);
                    if (currentSession) {
                        loadSession(currentSession.session_id,'',true);
                    }
                }
            });
    }

    function renderCurrentPage() {
        const sessionsList = document.getElementById('sessions-list');
        sessionsList.innerHTML = '';
        
        // 计算当前页的起始和结束索引
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, allSessions.length);
        
        // 获取当前会话ID
        const currentSessionFromStorage = sessionStorage.getItem('current_session_id');
        
        // 添加当前页的会话
        for (let i = startIndex; i < endIndex; i++) {
            const session = allSessions[i];
            const isCurrent = session.session_id === currentSessionFromStorage;
            addSessionToUI(session, isCurrent);
        }
    }

    function updatePaginationControls() {
        const prevBtn = document.getElementById('prev-page-btn');
        const nextBtn = document.getElementById('next-page-btn');
        const pageNumbers = document.getElementById('page-numbers');
        
        // 更新上一页/下一页按钮状态
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
        
        // 生成页码按钮
        pageNumbers.innerHTML = '';
        
        // 计算显示的页码范围
        let startPage = Math.max(1, currentPage - Math.floor(maxPageButtons / 2));
        let endPage = Math.min(totalPages, startPage + maxPageButtons - 1);
        
        // 调整起始页码以确保显示完整的5个按钮（如果有足够的页面）
        if (endPage - startPage + 1 < maxPageButtons) {
            startPage = Math.max(1, endPage - maxPageButtons + 1);
        }
        
        // 创建页码按钮
        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `page-number-btn ${i === currentPage ? 'active' : ''}`;
            pageBtn.textContent = i;
            pageBtn.addEventListener('click', () => goToPage(i));
            pageNumbers.appendChild(pageBtn);
        }
    }

    function goToPage(page) {
        if (page < 1 || page > totalPages || page === currentPage) return;
        
        currentPage = page;
        renderCurrentPage();
        updatePaginationControls();
    }

    function goToPrevPage() {
        if (currentPage > 1) {
            goToPage(currentPage - 1);
        }
    }

    function goToNextPage() {
        if (currentPage < totalPages) {
            goToPage(currentPage + 1);
        }
    }

    function addSessionToUI(session, isCurrent) {
        const sessionElement = document.createElement('div');
        sessionElement.className = `session-item ${isCurrent ? 'current-session' : ''}`;
        sessionElement.dataset.sessionId = session.session_id;
        sessionElement.dataset.isCurrent = isCurrent;
        
        // 使用北京时间格式化
        const beijingTime = formatBeijingTime(session.last_timestamp);
        
        sessionElement.innerHTML = `
            <button class="session-delete" title="删除这段对话" data-sid="${session.session_id}">✕</button>
            <div class="session-preview">
                <div class="session-topic">${session.keywords || '日常对话'}</div>
                <span class="session-time">${beijingTime}</span>
            </div>
            <div class="session-meta">
                ${session.message_count} 条消息
                ${isCurrent ? '<span class="current-badge">当前</span>' : ''}
            </div>
        `;
        
        sessionElement.addEventListener('click', () => {
            loadSession(session.session_id, session.last_message, isCurrent);
        });

        // 删除按钮：阻止冒泡，否则会同时触发"打开这段对话"
        const delBtn = sessionElement.querySelector('.session-delete');
        if (delBtn) {
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSession(session.session_id, session.keywords || '日常对话', sessionElement);
            });
        }
        
        sessionsList.appendChild(sessionElement);
    }

    // 删除一段对话
    async function deleteSession(sessionId, title, element) {
        if (!confirm(`确定删除这段对话吗？\n\n「${title}」\n\n删除后无法恢复。`)) {
            return;
        }
        try {
            const resp = await fetch(`/chat/session/${encodeURIComponent(sessionId)}`, {
                method: 'DELETE'
            });
            const data = await resp.json();
            if (!resp.ok) {
                alert('删除失败：' + (data.error || resp.status));
                return;
            }

            // 从界面上移除
            element.style.transition = 'opacity .2s, transform .2s';
            element.style.opacity = '0';
            element.style.transform = 'translateX(-12px)';
            setTimeout(() => element.remove(), 200);

            // 如果删的正是当前查看的会话，清空右侧内容
            if (currentSessionId === sessionId) {
                currentSessionId = null;
                sessionStorage.removeItem('current_session_id');
                const chatMessages = document.getElementById('chat-messages');
                if (chatMessages) {
                    chatMessages.innerHTML =
                        '<div class="empty-hint">这段对话已删除，请从左侧选择其他对话，或点击「+ 新对话」开始。</div>';
                }
                const continueBtn = document.getElementById('continue-chat-btn');
                if (continueBtn) continueBtn.remove();
            }
        } catch (err) {
            alert('删除请求失败：' + err.message);
        }
    }

    function loadSession(sessionId, sessionTitle, isCurrent) {
        // 如果点击的是当前已选中的会话，则不重复加载
        if (currentSessionId === sessionId && isCurrentSession === isCurrent) {
            return;
        }
        
        // 清除之前的继续对话按钮
        const continueBtn = document.getElementById('continue-chat-btn');
        if (continueBtn) {
            continueBtn.remove();
        }

        currentSessionId = sessionId;
        isCurrentSession = isCurrent;
        
        if (isCurrent) {
            currentSessionTitle.textContent = '当前对话';
            sessionInfo.textContent = '继续对话';
            chatInputContainer.style.display = 'flex';
            sessionStorage.setItem('current_session_id', sessionId);
        } else {
            currentSessionTitle.textContent = '历史对话';
            sessionInfo.textContent = '查看历史记录';
            chatInputContainer.style.display = 'none';

            // 为历史对话添加继续对话按钮
            const newContinueBtn = document.createElement('button');
            newContinueBtn.id = 'continue-chat-btn';
            newContinueBtn.className = 'continue-chat-btn';
            newContinueBtn.textContent = '继续对话';
            newContinueBtn.style.marginLeft = '10px';
            newContinueBtn.onclick = () => continueChat(sessionId);
            
            document.querySelector('.chat-header').appendChild(newContinueBtn);
        }
        
        // Update session items styling
        document.querySelectorAll('.session-item').forEach(item => {
            item.classList.remove('active');
            if (item.dataset.sessionId === sessionId) {
                item.classList.add('active');
            }
        });
        
        // 显示加载状态
        chatHistory.innerHTML = '<div class="placeholder-message"><p>加载中...</p></div>';
        
        fetch(`/chat/session/${sessionId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('加载失败');
                }
                return response.json();
            })
            .then(messages => {
                chatHistory.innerHTML = '';
                if (messages.length === 0) {
                    chatHistory.innerHTML = `
                        <div class="placeholder-message">
                            <p>还没有对话记录</p>
                        </div>
                    `;
                } else {
                    messages.forEach(msg => {
                        // 格式化消息时间为北京时间
                        const beijingMsgTime = formatBeijingTime(msg.timestamp);
                        addMessageToUI(msg.role, msg.content, beijingMsgTime);
                    });
                }
            })
            .catch(error => {
                console.error('加载会话失败:', error);
                chatHistory.innerHTML = `
                    <div class="placeholder-message">
                        <p>加载失败，请重试</p>
                    </div>
                `;
            });
    }

    function continueChat(sessionId) {
        // 清除之前的继续对话按钮
        const continueBtn = document.getElementById('continue-chat-btn');
        if (continueBtn) {
            continueBtn.remove();
        }
        
        // 设置当前会话
        currentSessionId = sessionId;
        isCurrentSession = true;
        
        // 更新UI
        currentSessionTitle.textContent = '当前对话';
        sessionInfo.textContent = '继续对话';
        chatInputContainer.style.display = 'flex';
        
        // 保存到sessionStorage并刷新会话列表
        sessionStorage.setItem('current_session_id', sessionId);
        loadSessions(); // 这会更新所有会话的状态
    }

    function sendMessage() {
        if (!currentSessionId || !isCurrentSession) {
            alert('请先选择或创建一个当前对话');
            return;
        }

        const message = messageInput.value.trim();
        if (!message) return;
        
        addMessageToUI('user', message, new Date().toLocaleString());
        messageInput.value = '';
        
        fetch('/chat/send', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ 
                message: message,
                session_id: currentSessionId 
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.reply) {
                addMessageToUI('assistant', data.reply, new Date().toLocaleString());
                loadSessions(); // Refresh sessions list
            }
        })
        .catch(error => {
            console.error('发送消息失败:', error);
            alert('发送消息失败，请重试');
        });
    }

    function addMessageToUI(role, content, timestamp) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        
        const roleLabel = role === 'user' ? '你' : '心理助手';
        messageDiv.innerHTML = `
            <div class="message-header">
                <span class="role">${roleLabel}</span>
                <span class="time">${timestamp}</span>
            </div>
            <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
        `;
        
        if (role === 'assistant') {
            const voiceBtn = document.createElement('button');
            voiceBtn.className = 'voice-play-btn';
            voiceBtn.innerHTML = '🔊';
            voiceBtn.title = '播放语音';
            voiceBtn.onclick = () => playVoice(content, voiceBtn);
            messageDiv.querySelector('.message-content').appendChild(voiceBtn);
        }
        
        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // Voice recording and playback functions
    voiceBtn.addEventListener('click', toggleRecording);
    
    async function toggleRecording() {
        if (!isCurrentSession) {
            alert('只能在当前对话中使用语音功能');
            return;
        }
        
        if (isRecording) {
            stopRecording();
        } else {
            await startRecording();
        }
    }

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    sampleRate: 16000,
                    channelCount: 1,
                    echoCancellation: false,
                    noiseSuppression: false
                }
            });

            const options = { 
                mimeType: 'audio/webm;codecs=opus',
                audioBitsPerSecond: 16000
            };
            
            mediaRecorder = new MediaRecorder(stream, options);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                
                showSttProgress(true);
                try {
                    const response = await fetch('/chat/voice-input', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    if (response.ok && result.text) {
                        sttReach(100, '识别完成');
                        messageInput.value = result.text;
                        showToast('识别完成，可以直接发送', 'ok');
                    } else {
                        // 原来这里只 console.error，用户完全不知道发生了什么
                        showToast('语音识别失败：' + (result.error || ('HTTP ' + response.status)), 'err', 9000);
                    }
                } catch (error) {
                    showToast('语音识别请求失败：' + error.message, 'err', 9000);
                } finally {
                    showSttProgress(false);
                }
            };
            
            mediaRecorder.start();
            isRecording = true;
            voiceBtn.classList.add('recording');
            voiceBtn.textContent = '⏹️';
        } catch (error) {
            // 把麦克风权限类错误翻译成人能看懂、能操作的提示
            let tip = '';
            if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                tip = '麦克风权限被拒绝。请点击地址栏左侧的 🔒/⚙️ 图标，把「麦克风」改为「允许」，再刷新页面。';
            } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
                tip = '没有检测到麦克风设备。';
            } else if (error.name === 'NotReadableError') {
                tip = '麦克风被其他程序占用了（如会议软件），请关闭后重试。';
            } else if (!window.isSecureContext) {
                tip = '语音功能需要安全环境，请用 http://127.0.0.1:5000 或 http://localhost:5000 访问。';
            } else {
                tip = '录音启动失败：' + error.name + ' ' + error.message;
            }
            showToast(tip, 'err', 10000);
        }
    }
    
    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            voiceBtn.classList.remove('recording');
            voiceBtn.textContent = '🎤';
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
        }
    }

    // ============ 语音识别进度 ============
    // 讯飞识别是一次性 WebSocket 请求，服务端拿不到中间进度，
    // 所以这里用"按实测 10 秒基准推进"的伪进度：前期快、后期慢，
    // 到 92% 停住等真实结果 —— 目的是让用户确信"系统在干活"，
    // 而不是盯着不动的界面怀疑识别失败了。
    let sttTimer = null;
    let sttPct = 0;

    function showSttProgress(show) {
        const box = document.getElementById('stt-progress');
        const bar = document.getElementById('stt-bar');
        const pct = document.getElementById('stt-percent');
        const label = document.getElementById('stt-label');
        if (!box) return;

        if (sttTimer) { clearInterval(sttTimer); sttTimer = null; }

        if (!show) {
            box.style.display = 'none';
            sttPct = 0;
            if (bar) bar.style.width = '0%';
            if (pct) pct.textContent = '0%';
            if (label) label.textContent = '正在识别语音…';
            return;
        }

        sttPct = 4;
        box.style.display = 'block';
        bar.style.width = sttPct + '%';
        pct.textContent = sttPct + '%';
        label.textContent = '正在识别语音…';

        sttTimer = setInterval(() => {
            // 越接近上限推进越慢，避免"卡在 100% 还没结果"的尴尬
            const room = 92 - sttPct;
            const step = Math.max(0.6, room * 0.08);
            sttPct = Math.min(92, sttPct + step);
            bar.style.width = sttPct.toFixed(1) + '%';
            pct.textContent = Math.round(sttPct) + '%';
            if (sttPct > 55) label.textContent = '正在整理文字…';
        }, 420);
    }

    function sttReach(v, text) {
        const bar = document.getElementById('stt-bar');
        const pct = document.getElementById('stt-percent');
        const label = document.getElementById('stt-label');
        if (bar) bar.style.width = v + '%';
        if (pct) pct.textContent = v + '%';
        if (label && text) label.textContent = text;
    }

    // ============ 语音播放：点一下播放，再点一下暂停 ============
    // 全局只保留一个音频实例，避免多条消息同时播放、声音叠加（"特别吵"）。
    let currentAudio = null;      // 当前正在播放/暂停的 Audio 对象
    let currentVoiceBtn = null;   // 当前按钮，用于切换图标
    let voiceCache = {};          // text -> objectURL，避免重复请求浪费讯飞额度

    function _resetVoiceBtn(btn) {
        if (!btn) return;
        btn.innerHTML = '🔊';
        btn.title = '播放语音';
        btn.classList.remove('playing');
    }

    function stopCurrentVoice() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.onended = null;
            currentAudio.onerror = null;
            currentAudio = null;
        }
        _resetVoiceBtn(currentVoiceBtn);
        currentVoiceBtn = null;
    }

    async function playVoice(text, btn) {
        // 同一个按钮 -> 播放/暂停 切换
        if (currentAudio && currentVoiceBtn === btn) {
            if (currentAudio.paused) {
                try {
                    await currentAudio.play();
                    btn.innerHTML = '⏸️';
                    btn.title = '暂停播放';
                    btn.classList.add('playing');
                    showToast('继续播放', 'ok', 1200);
                } catch (e) {
                    showToast('恢复播放失败：' + (e.message || e), 'err', 8000);
                }
            } else {
                currentAudio.pause();
                btn.innerHTML = '🔊';
                btn.title = '继续播放';
                btn.classList.remove('playing');
                showToast('已暂停', 'info', 1200);
            }
            return;
        }

        // 换了一条消息 -> 先停掉上一条（这正是"重复点很吵"的根源）
        stopCurrentVoice();
        currentVoiceBtn = btn;
        btn.innerHTML = '⏳';
        btn.title = '合成中…';
        showToast('正在合成语音…', 'info', 0);

        try {
            let url = voiceCache[text];
            if (!url) {
                const response = await fetch('/chat/voice-output', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!response.ok) {
                    let msg = 'HTTP ' + response.status;
                    try {
                        const j = await response.json();
                        if (j && j.error) msg = j.error;
                    } catch (e) { /* 非 JSON 就沿用状态码 */ }
                    throw new Error(msg);
                }
                const blob = await response.blob();
                url = URL.createObjectURL(new Blob([blob], { type: 'audio/mpeg' }));
                voiceCache[text] = url;   // 缓存，二次播放不再请求
            }

            const audio = new Audio(url);
            currentAudio = audio;
            audio.onended = () => {
                _resetVoiceBtn(btn);
                if (currentAudio === audio) { currentAudio = null; currentVoiceBtn = null; }
            };
            audio.onerror = () => {
                _resetVoiceBtn(btn);
                showToast('音频播放出错，请重试。', 'err', 8000);
            };

            await audio.play();
            btn.innerHTML = '⏸️';
            btn.title = '暂停播放';
            btn.classList.add('playing');
            showToast('开始播放（再点一下可暂停）', 'ok', 1800);
        } catch (error) {
            _resetVoiceBtn(btn);
            if (currentVoiceBtn === btn) { currentVoiceBtn = null; currentAudio = null; }
            const m = String(error && error.message || error);
            if (m.includes('NotAllowedError') || m.includes("didn't interact")) {
                showToast('浏览器阻止了自动播放，请再点一次 🔊 按钮。', 'err', 8000);
            } else {
                showToast('语音播放失败：' + m, 'err', 9000);
            }
        }
    }

    // 轻量提示条：把原来只写进控制台的错误显示到页面上
    function showToast(msg, kind, duration) {
        if (duration === undefined) duration = 5000;
        let box = document.getElementById('chat-toast');
        if (!box) {
            box = document.createElement('div');
            box.id = 'chat-toast';
            document.body.appendChild(box);
        }
        const colors = {
            err:  { bg: '#FBE9E5', fg: '#8A4A3C', bd: '#F0CFC7' },
            ok:   { bg: '#E8F4F2', fg: '#3F7A73', bd: '#C9E3DF' },
            info: { bg: '#F4F1EA', fg: '#6B7B8D', bd: '#E0DCD5' }
        };
        const c = colors[kind] || colors.info;
        box.textContent = msg;
        box.style.background = c.bg;
        box.style.color = c.fg;
        box.style.borderColor = c.bd;
        box.style.display = 'block';
        if (box._timer) { clearTimeout(box._timer); box._timer = null; }
        if (duration > 0) {
            box._timer = setTimeout(() => { box.style.display = 'none'; }, duration);
        }
    }
});
</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat_history.css') }}">
{% endblock %}
